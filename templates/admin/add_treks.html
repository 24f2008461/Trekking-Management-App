{% extends "base.html" %}
{% block title %}Add Trek{% endblock %}
{% block content %}
<div class="page-heading">
  <h1>Add New Trek</h1>
  <u>Create a new trekking route</u>
</div>

<div class="form-panel">
    <form action="{{ url_for('admin.add_treks') }}">
        <div class="row">
            <div class="col-lg-6">
                <div class="form-group">
                    <label for="name">Trek Name</label>
                    <input type="text" name="name" id="name" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" name="location" id="location" required>
                </div>
                <div  class="form-group">
                    <label for="duration">Duration(Days)</label>
                    <input type="number" name="duration" id="duration" required>
                </div>
                <div class="form-group" >
                    <label for="difficulty">Difficulty</label>
                    <select name="difficulty" id="difficulty" required>
                        <option value="Easy">Easy</option>
                        <option value="Moderate">Moderate</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div  class="form-group">
                    <label for="total_slots">Total Slorts</label>
                    <input type="number" name="total_slots" id="total_slots" required>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="form-group">
                    <label for="price">(Rs)Price</label>
                    <input type="number" name="price" id="price" min="0" step="0.01" value="0" required>
                </div>
                <div class="form-group">
                    <label for="assigned_staff">Assigned Staff</label>
                    <select type="text" name="assigned_staff" id="assigned_staff" required> 
                        <option value="">— None —</option>
                        {% for s in staff_list %}
                        <option value="{{ s.user_id }}">{{ s.fullname }}</option>
                        {% endfor %}
                    </select>
                </div class="form-group">
                <div class="form-group">
                    <label for="start_date">Start Date</label>
                    <input type="date" name="start_date" id="start_date" required>
                </div>
                <div class="form-group">
                    <label for="end_date">End Date</label>
                    <input type="date" name="end_date" id="end_date" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select name="status" id="status" required>
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group" >
            <label for="discription">Discription</label>
            <textarea name="discription" id="discription" rows="2" style="border-radius: 6px; border: transparent;"></textarea>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary-custom">Create Trek</button>
            <a href="{{ url_for('admin.find_treks') }}" class="btn btn-outline-custom">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
