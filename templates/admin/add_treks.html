{% extends "base.html" %}
{% block title %}Add Trek{% endblock %}
{% block content %}
<div class="page-heading">
  <h2>Add New Trek</h2>
  <u>Create a new trekking route</u>
</div>

<div class="form-panel">
    <div class="py-1 border-bottom d-flex justify-content-center align-items-center">
         <h2 class="mb-0 fs-2 fw-bold" style="color: var(--accent-pale)">Add New Treks</h2>
    </div>
    <form action="{{ url_for('admin.add_treks') }}" method="POST" enctype=multipart/form-data>
        <div class="row py-3">
            <div class="col-lg-6">
                <div class="form-group">
                    <label for="tname">Trek Name </label>
                    <input class="form-control" type="text" name="tname" id="tname" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input class="form-control" type="text" name="location" id="location" required>
                </div>
                <div  class="form-group">
                    <label for="duration">Duration(Days)</label>
                    <input class="form-control" type="number" name="duration" id="duration" required>
                </div>
                <div class="form-group" >
                    <label for="difficulty">Difficulty</label>
                    <select class="form-control" name="difficulty" id="difficulty" required>
                        <option value="Easy">Easy</option>
                        <option value="Moderate">Moderate</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div  class="form-group">
                    <label for="total_slots">Total Slorts</label>
                    <input class="form-control" type="number" name="total_slots" id="total_slots" required>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="form-group">
                    <label for="price">(Rs)Price</label>
                    <input class="form-control" type="number" name="price" id="price"  min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="assigned_staff">Assigned Staff</label>
                    <select class="form-control" type="text" name="assigned_staff" id="assigned_staff"> 
                        <option value="">— None —</option>
                        {% for staff in staff_list %}
                        <option value="{{ staff.user_id }}">{{ staff.fullname }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="start_date">Start Date</label>
                    <input class="form-control" type="date" name="start_date" id="start_date" required>
                </div>
                <div class="form-group">
                    <label for="end_date">End Date</label>
                    <input class="form-control" type="date" name="end_date" id="end_date" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select class="form-control" name="status" id="status" required>
                        <option value="Pending" >Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="file">Image</label>
            <input type="file" class="form-control" name="file" accept="image/*" required>
        </div>
        <div class="form-group" >
            <label for="description">Description</label>
            <textarea class="form-control" name="description" id="description" rows="2" style="border-radius: 6px; border: transparent;"></textarea>
        </div>
        <div class="mt-5 d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-primary">Add Trek</button>
            <a href="{{ url_for('admin.find_treks') }}" class="btn btn-outline-danger">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
