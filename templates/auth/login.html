<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %} Trekk Application {% endblock %} | Trekking Management</title>
  
  <!-- Bootstrap & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    {% if session.get('user_id') %}
    <div class="fullbody d-flex flex-column min-vh-100">
        
<form class="input-form">
    <div style="height: 400px;">
        <h1 class="auth-title">Trekk App</h1>
        <p class="auth-subtitle">Sign in to your Account</p>

      
        <div class="form-box">
            
            <input type="email" name="email" placeholder="Email" >
            <input type="password" name="password" placeholder="Password">
            <label for="" style="display:flex; flex-direction: row; height: 50px; align-items: center;">
                <input type="checkbox" name="rememberme" style="width: 15px; height: 50px; margin-left: 65px; margin-right: 70px; box-shadow: none;"> 
                <p style="font-size: 16px; margin-top: 18px;">Remember Me</p>
            </label>
        
            <button >Sign In</button>
        </div>
        <p style="display:inline-block;font-size:13px; padding-left: 50px ;">Don't have an account? </p><a href="signup.html" style="font-size: medium; text-decoration: none;"> Register here</a>
    </div>
    {% endif %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
