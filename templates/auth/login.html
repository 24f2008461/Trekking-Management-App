<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Trekk App</title>
  
  <!-- Bootstrap & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="fullbody d-flex flex-column min-vh-100">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for cat, msg in messages %}
        
        <div class="alert alert-{{ cat }} position-fixed top-10 start-50 translate-middle-x p-3 alert-dismissible fade show shadow-lg d-flex align-items-center" role="alert" style="min-width: 300px; border-radius: 10px;">
            <div class="me-auto fw-medium">
                {{ msg }}
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" style="border: none;"></button>
        </div>
    {% endfor %}
    {% endif %}
    {% endwith %} 

    <div class="auth-form">
        <h1  class="auth-title">Trekk<span style="color: #000; text-shadow: none;">Trail</span></h1>
        <p class="auth-subtitle">Login to your Account</p>
        
        <form action="{{ url_for('auth.login') }}" method="POST" class="auth-box">
            
            <input type="text" name="uname" placeholder="Username" class="form-control" >
            <input type="password" name="password" placeholder="Password" class="form-control">
            <label for="rememberme" style="display:flex; flex-direction: row; height: 50px; align-items: center; justify-content:space-between;">
                <input type="checkbox" name="rememberme" style="box-shadow: none;"> 
                <p style="color: #000; font-size: 16px; margin-top: 18px;">Remember Me</p>
            </label>
        
            <button class="btn sm btn-danger" >Login</button>
        </form>
        <p style="color: #000; margin: 0; font-size:1rem; padding-top: 1rem;">Don't have an account? </p><a href="{{ url_for('auth.register')}}" style="font-size: 1rem; text-decoration: none;padding-top: 0; padding-bottom: 1rem;"> Register Here!</a>
    </div>
    
       <footer class="mt-5 pt-3 pb-2 text-center" style="border-top: 1px solid black ;">
            <small class="text-black">&copy; 2026 Trekk App | Trekking Management Application</small>
        </footer>
    </div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
