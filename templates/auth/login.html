<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Trekk App</title>
  
  <!-- Bootstrap & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="fullbody d-flex flex-column min-vh-100">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for cat, msg in messages %}
        
        <div class="alert alert-{{ cat }} position-fixed top-0 start-50 translate-middle-x p-3 alert-dismissible fade show shadow-lg d-flex align-items-center" role="alert" style="min-width: 300px; border-radius: 10px;">
            <div class="me-auto fw-medium">
                {{ msg }}
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert style="border: transparent; "></button>
        </div>
    {% endfor %}
    {% endif %}
    {% endwith %} 

    <div class="input-login-form">
        <h1 class="auth-title">Trekk App</h1>
        <p class="auth-subtitle">Sign in to your Account</p>
        
        <form action="{{ url_for('auth.login') }}" method="POST" class="form-box">
            
            <input type="text" name="uname" placeholder="Username" >
            <input type="password" name="password" placeholder="Password">
            <!-- <label for="" style="display:flex; flex-direction: row; height: 50px; align-items: center;">
                <input type="checkbox" name="rememberme" style="width: 15px; height: 50px; margin-left: 65px; margin-right: 70px; box-shadow: none;"> 
                <p style="font-size: 16px; margin-top: 18px;">Remember Me</p>
            </label> -->
        
            <button>Login</button>
        </form>
        <p style="margin: 0; font-size:1rem; padding-top: 1rem;">Don't have an account? </p><a href="{{ url_for('auth.register')}}" style="font-size: 1rem; text-decoration: none;padding-top: 0; padding-bottom: 1rem;"> Register Here!</a>
    </div>
    
        <footer class="footer">
            <div class="container">
                <p class="mb-0">&copy; 2026 Trekk App | Trekking Management Application</p>
            </div>
        </footer>
    </div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
