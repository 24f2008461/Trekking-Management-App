<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %} Trekk Application {% endblock %} | Trekking Management</title>
  
  <!-- Bootstrap & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="fullbody d-flex flex-column min-vh-100">
        

    <div class="input-login-form">
        <h1 class="auth-title">Trekk App</h1>
        <p class="auth-subtitle">Sign in to your Account</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
            {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
      
        <form class="form-box" action="{{ url_for('auth.login') }}" method="post">
            
            <input type="text" name="uname" placeholder="Username" >
            <input type="password" name="password" placeholder="Password">
            <label for="" style="display:flex; flex-direction: row; height: 50px; align-items: center;">
                <input type="checkbox" name="rememberme" style="width: 15px; height: 50px; margin-left: 65px; margin-right: 70px; box-shadow: none;"> 
                <p style="font-size: 16px; margin-top: 18px;">Remember Me</p>
            </label>
        
            <button>Login</button>
        </form>
        <p style="display:inline-block;font-size:13px; padding-left: 50px ;">Don't have an account? </p><a href="{{ url_for('auth.register')}}" style="font-size: 1rem; text-decoration: none;"> Register Here!</a>
    </div>
    
        <footer class="footer">
            <div class="container">
                <p class="mb-0">&copy; 2026 Trekk App | Trekking Management Application</p>
            </div>
        </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
