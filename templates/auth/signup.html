<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Trekk App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    
<div class="fullbody d-flex flex-column min-vh-100">   
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for cat, msg in messages %}
        
        <div class="alert alert-{{ cat }} position-fixed top-10 start-50 translate-middle-x p-3 alert-dismissible fade show shadow-lg d-flex align-items-center" role="alert" style="min-width: 300px; border-radius: 10px;">
            <div class="me-auto fw-medium">
                {{ msg }}
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" style="border: none;"></button>
        </div>
    {% endfor %}
    {% endif %}
    {% endwith %} 
    <div class="auth-form">
        <div>
            <h1 class="auth-title">Trekk App</h1>
            <p class="auth-subtitle">Sign Up to a Account</p>
        </div>
        <form class="auth-box" action="{{ url_for('auth.register') }}" method="POST">
            <input type="text" name="uname" placeholder="Username" class="form-control" required>
            <input type="text" name="fname" placeholder="Full Name"  class="form-control" required>
            <input type="email" name="email" placeholder="Email" class="form-control" required >
            <input type="password" name="password" placeholder="Password" class="form-control" required >
            <input type="password" name="fpassword" placeholder="Confirm Password" class="form-control" required >
            <input type="text" name="phone_no" placeholder="Phone Number" class="form-control" maxlength="10">   
            <select name="role" id="role" class="form-control">
                <option value="">Select Role</option>
                <option value="user">Trekker</option>
                <option value="staff">Trek Staff</option>
            </select>     
            <button class="btn sm btn-danger " >Sign Up</button>
        </form>
         <p style="margin: 0; font-size:1rem; padding-top: 1rem;">Already have an account? </p><a href="{{ url_for('auth.login')}}" style="font-size: 1rem; text-decoration: none;padding-top: 0; padding-bottom: 1rem;">Login Here!</a>
    </div>
    <footer class="mt-5 pt-3 pb-2 text-center" style="border-top: 1px solid black ;">
        <small class="text-black">&copy; 2026 Trekk App | Trekking Management Application</small>
    </footer>
</div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
