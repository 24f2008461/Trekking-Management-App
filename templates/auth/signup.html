<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>    
    <div class="input-form">
        <div>
            <h1 class="auth-title">Trekk App</h1>
            <p class="auth-subtitle">Sign Up to a Account</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
            {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form class="form-box" action="{{ url_for('auth.register') }}" method="post">
            <input type="text" name="uname" placeholder="Username" required>
            <input type="text" name="fname" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required >
            <input type="password" name="password" placeholder="Password" required >
            <input type="password" name="fpassword" placeholder="Confirm Password" required >
            <input type="text" name="phone_no" placeholder="Phone Number" >        
            <button >Sign Up</button>
        </form>
        <p style="display:inline-block;font-size: 1rem; padding-left: 1.7rem ;">Already have account?</p><a href="{{ url_for('auth.login') }}" style="font-size: 1rem; text-decoration: none;"> Login Here!</a>
   
    </div>
     <footer class="footer">
            <div class="container">
                <p class="mb-0">&copy; 2026 Trekk App | Trekking Management Application</p>
            </div>
        </footer>
   


</body>
</html>
